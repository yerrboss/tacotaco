<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TacoTaco - Seoul Live GPS & Cute Pixel Food Truck</title>
  
  <!-- Leaflet CSS for Real Map Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      font-family: 'Silkscreen', cursive;
      user-select: none;
      -webkit-font-smoothing: none;
    }

    .font-arcade {
      font-family: 'Press Start 2P', cursive;
    }

    /* CORE PIXELATION MAP FILTER */
    .pixelated-map .leaflet-tile-container img {
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      filter: contrast(125%) saturate(150%) hue-rotate(-5deg);
    }

    .pixelated-map .leaflet-container {
      background: #1e293b;
    }

    /* Chunky Arcade UI Styling */
    .pixel-box-vibrant {
      background: #fffbe8;
      border: 4px solid #000;
      box-shadow: 
        inset 0 0 0 2px #fff,
        0 0 0 2px #000,
        4px 6px 0 0 rgba(0, 0, 0, 0.85);
    }

    .pixel-btn-sun {
      background: #ff5964;
      color: #ffffff;
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px 0px #b81d28,
        inset 3px 3px 0px 0px #ff9aa2,
        3px 4px 0 0 #000;
      transition: all 0.05s ease;
    }
    .pixel-btn-sun:active {
      transform: translate(2px, 2px);
      box-shadow: 
        inset 3px 3px 0px 0px #b81d28,
        1px 1px 0 0 #000;
    }

    .pixel-btn-sky {
      background: #35a7ff;
      color: #ffffff;
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px 0px #0066b8,
        inset 3px 3px 0px 0px #85ccff,
        3px 4px 0 0 #000;
    }

    /* CRT Scanline Filter */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0,0,0,0.18) 50%,
        rgba(0,0,0,0.18)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    .location-btn {
      border: 2px solid #000;
      box-shadow: 2px 2px 0 0 #000;
      font-size: 8px;
      padding: 3px 6px;
    }

    .pixel-scroll::-webkit-scrollbar {
      width: 12px;
    }
    .pixel-scroll::-webkit-scrollbar-track {
      background: #ffeaa7;
      border-left: 2px solid #000;
    }
    .pixel-scroll::-webkit-scrollbar-thumb {
      background: #ff5964;
      border: 2px solid #000;
    }

    .weather-vignette {
      pointer-events: none;
      transition: background 1.5s ease;
    }

    /* 
      ==================================================================
      CUSTOM PIXEL ART TACO TRUCK MARKER CSS
      ==================================================================
    */
    .truck-marker-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Floating Speech Bubble */
    .speech-bubble {
      font-family: 'Press Start 2P', cursive;
      font-size: 7px;
      background: #ffffff;
      color: #000000;
      padding: 3px 6px;
      border: 2px solid #000000;
      box-shadow: 2px 2px 0 0 #000;
      white-space: nowrap;
      margin-bottom: 4px;
      position: relative;
      animation: floatBubble 2s infinite ease-in-out;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 5px 0;
      border-style: solid;
      border-color: #000000 transparent;
      display: block;
      width: 0;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* CUSTOM PIXEL TRUCK CONTAINER */
    .pixel-taco-truck {
      width: 72px;
      height: 48px;
      position: relative;
      filter: drop-shadow(0px 4px 0px rgba(0,0,0,0.6));
    }

    /* Roof Sign */
    .truck-sign {
      position: absolute;
      top: -12px;
      left: 10px;
      background: #ff0055;
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      font-size: 6px;
      padding: 1px 4px;
      border: 2px solid #000;
      box-shadow: 1px 1px 0 0 #000;
      z-index: 10;
      animation: neonGlow 1.5s infinite alternate;
    }

    @keyframes neonGlow {
      0% { background: #ff0055; box-shadow: 0 0 4px #ff0055; }
      100% { background: #ffbc00; color: #000; box-shadow: 0 0 8px #ffbc00; }
    }

    /* Truck Main Body */
    .truck-body {
      width: 68px;
      height: 34px;
      background: #ff5964; /* Vibrant Pink/Red */
      border: 3px solid #000;
      position: absolute;
      top: 6px;
      left: 2px;
      border-radius: 4px 10px 2px 2px;
    }

    /* Truck Front Cabin */
    .truck-cabin {
      position: absolute;
      top: 2px;
      right: 0px;
      width: 22px;
      height: 18px;
      background: #ffeaa7; /* Cute Cream Yellow */
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      border-top-right-radius: 6px;
    }

    .cabin-window {
      width: 12px;
      height: 10px;
      background: #7dd3fc;
      border: 2px solid #000;
      margin: 2px auto 0;
    }

    /* Service Window & Awning */
    .service-window {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 32px;
      height: 16px;
      background: #334155;
      border: 2px solid #000;
      overflow: hidden;
    }

    .chef-inside {
      font-size: 10px;
      position: absolute;
      bottom: -1px;
      left: 8px;
    }

    .awning {
      position: absolute;
      top: 2px;
      left: 4px;
      width: 36px;
      height: 6px;
      background: repeating-linear-gradient(
        90deg,
        #ef4444,
        #ef4444 6px,
        #ffffff 6px,
        #ffffff 12px
      );
      border: 2px solid #000;
      z-index: 5;
    }

    /* Cute Pixel Wheels */
    .wheel {
      width: 12px;
      height: 12px;
      background: #1e293b;
      border: 2px solid #000;
      border-radius: 50%;
      position: absolute;
      bottom: -4px;
      z-index: 6;
    }
    .wheel::after {
      content: '';
      width: 4px;
      height: 4px;
      background: #94a3b8;
      position: absolute;
      top: 2px;
      left: 2px;
      border-radius: 50%;
    }
    .wheel-left { left: 10px; }
    .wheel-right { right: 12px; }

    /* Bottom Headlight */
    .headlight {
      width: 4px;
      height: 6px;
      background: #facc15;
      border: 1px solid #000;
      position: absolute;
      right: -2px;
      bottom: 8px;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-black overflow-hidden w-screen h-screen relative select-none">

  <!-- Map Container -->
  <div id="map" class="absolute inset-0 w-full h-full pixelated-map z-0"></div>

  <!-- CRT Overlay & Weather Canvas -->
  <div class="scanlines fixed inset-0 z-10"></div>
  <div id="weatherVignette" class="weather-vignette fixed inset-0 z-20"></div>
  <canvas id="precipCanvas" class="fixed inset-0 z-20 pointer-events-none"></canvas>

  <!-- TOP-LEFT: REAL SEOUL GPS & AUTO WEATHER -->
  <div class="fixed top-4 left-4 z-30 pointer-events-auto flex flex-col gap-2">
    <div class="pixel-box-vibrant p-2.5 max-w-xs flex flex-col gap-1.5">
      <div class="flex items-center justify-between border-b-2 border-black pb-1">
        <span class="font-arcade text-[8px] text-black flex items-center gap-1">
          <i data-lucide="map" class="w-3 h-3 text-red-600"></i> REAL SEOUL GPS
        </span>
        <span id="seoulSpotBadge" class="bg-amber-400 text-black px-1.5 py-0.5 text-[8px] font-arcade border border-black">
          HONGDAE
        </span>
      </div>

      <div class="flex items-center justify-between text-[10px] text-gray-800 pt-0.5">
        <span class="font-bold flex items-center gap-1">
          <span id="weatherIconDisplay">📡</span> WEATHER:
        </span>
        <span id="weatherStatusText" class="font-arcade text-emerald-700 text-[9px]">SYNCING...</span>
      </div>

      <div class="text-[9px] text-gray-600 flex justify-between items-center border-t border-gray-300 pt-1 mt-0.5">
        <span>Temp: <strong id="tempDisplay" class="text-black">--°C</strong></span>
        <span class="text-[8px] font-arcade text-emerald-600 bg-emerald-100 px-1 border border-emerald-500">AUTO-SYNCED</span>
      </div>
    </div>

    <!-- Location Jumps -->
    <div class="pixel-box-vibrant p-1.5 flex flex-wrap gap-1 max-w-xs">
      <span class="font-arcade text-[7px] text-gray-700 w-full mb-0.5">📍 JUMP TO SEOUL SPOT:</span>
      <button onclick="moveToSpot(0)" class="location-btn bg-orange-100 text-black font-arcade">홍대 Hongdae</button>
      <button onclick="moveToSpot(1)" class="location-btn bg-red-100 text-black font-arcade">경복궁 Palace</button>
      <button onclick="moveToSpot(2)" class="location-btn bg-green-100 text-black font-arcade">남산 Namsan</button>
      <button onclick="moveToSpot(3)" class="location-btn bg-blue-100 text-black font-arcade">강남 Gangnam</button>
      <button onclick="moveToSpot(4)" class="location-btn bg-purple-100 text-black font-arcade">여의도 Yeouido</button>
    </div>
  </div>

  <!-- TOP-RIGHT HUD -->
  <div class="fixed top-4 right-4 z-30 flex flex-col items-end gap-3 max-w-xs sm:max-w-sm pointer-events-auto">
    <div class="pixel-box-vibrant p-3 w-full text-xs text-black flex flex-col gap-2">
      <div class="flex items-center justify-between border-b-2 border-black pb-2">
        <span class="flex items-center gap-2 font-arcade text-[9px] text-emerald-700">
          <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-none animate-ping"></span>
          LIVE TRACKER
        </span>
        <span class="bg-[#ff5964] text-white px-2 py-0.5 text-[8px] font-arcade tracking-widest border border-black shadow-[2px_2px_0_0_#000]">
          COOKING & SERVING 🌮
        </span>
      </div>
      
      <div class="flex items-center justify-between text-black text-[11px] pt-0.5">
        <span class="flex items-center gap-1.5 font-bold text-gray-700">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-red-600"></i>
          STOP:
        </span>
        <span id="locationName" class="text-black font-bold truncate">Hongdae St. Exit 9</span>
      </div>

      <div class="flex items-center justify-between bg-[#ffeaa7] p-2 border-2 border-black shadow-[2px_2px_0_0_#000]">
        <span class="text-[9px] text-black flex items-center gap-1 font-arcade">
          <i data-lucide="clock" class="w-3 h-3 text-red-600"></i> LEAVING IN:
        </span>
        <span id="countdownTimer" class="font-arcade text-red-600 text-[11px] tracking-widest font-bold">01:42:19</span>
      </div>

      <div class="bg-red-100 border-2 border-red-500 p-2 flex items-center justify-between text-[10px] text-red-900 shadow-[2px_2px_0_0_#000]">
        <span class="flex items-center gap-1 font-bold text-red-700 text-[9px]">
          🚨 LOW STOCK:
        </span>
        <span class="font-arcade text-red-600 text-[9px] truncate font-bold">Carne Asada (6 LEFT)</span>
      </div>
    </div>

    <button onclick="toggleMenu(true)" 
      class="pixel-btn-sun px-4 py-3 rounded-none flex items-center gap-3 font-arcade text-xs border-2 border-black cursor-pointer group mt-1">
      <span class="text-xl group-hover:scale-125 transition-transform">🌮</span>
      <span class="tracking-wider text-white">OPEN MENU</span>
    </button>
  </div>

  <!-- MENU MODAL -->
  <div id="menuModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
    <div class="pixel-box-vibrant w-full max-w-2xl max-h-[88vh] flex flex-col text-black relative">
      <div class="bg-[#ffca3a] border-b-4 border-black p-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">🌮</span>
          <h2 id="modalTitle" class="font-arcade text-black text-xs sm:text-sm tracking-wider">TACOTACO MENU [PAGE 1/2]</h2>
        </div>
        <button onclick="toggleMenu(false)" class="pixel-btn-sun px-2.5 py-1 text-xs font-arcade text-white">X</button>
      </div>

      <div id="page1" class="p-4 overflow-y-auto pixel-scroll flex-1 space-y-3 bg-[#fffbe8]">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="menuGrid"></div>
      </div>

      <div id="page2" class="p-4 overflow-y-auto pixel-scroll flex-1 space-y-4 bg-[#fffbe8] hidden">
        <div class="border-2 border-black bg-white p-1 shadow-[3px_3px_0_0_#000]">
          <table class="w-full text-left text-[11px] border-collapse">
            <thead>
              <tr class="bg-[#ffca3a] text-black border-b-2 border-black text-[9px] font-arcade">
                <th class="p-2.5">Ingredient</th>
                <th class="p-2.5">Origin</th>
                <th class="p-2.5">Notes</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="originTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="bg-[#ffca3a] border-t-4 border-black p-3.5 flex items-center justify-between">
        <button id="prevBtn" onclick="changePage(-1)" disabled class="pixel-btn-sky opacity-50 px-3 py-2 text-[9px] font-arcade cursor-not-allowed">◀ PREV</button>
        <div class="text-[10px] font-arcade text-black font-bold" id="pageIndicator">PG 1 / 2</div>
        <button id="nextBtn" onclick="changePage(1)" class="pixel-btn-sky px-3 py-2 text-[9px] font-arcade">NEXT ➔</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    lucide.createIcons();

    const seoulSpots = [
      { lat: 37.5566, lng: 126.9236, name: 'Hongdae St. Exit 9 (홍대입구역)', code: 'HONGDAE' },
      { lat: 37.5796, lng: 126.9770, name: 'Gyeongbokgung Palace (경복궁)', code: 'PALACE' },
      { lat: 37.5512, lng: 126.9882, name: 'N Seoul Tower (N서울타워)', code: 'NAMSAN' },
      { lat: 37.4979, lng: 127.0276, name: 'Gangnam St. Exit 11 (강남역)', code: 'GANGNAM' },
      { lat: 37.5262, lng: 126.9283, name: 'Yeouido Han River Park (여의도)', code: 'YEOUIDO' }
    ];

    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([seoulSpots[0].lat, seoulSpots[0].lng], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ------------------------------------------------------------------
    // CUTE CUSTOMIZED PIXEL FOOD TRUCK MARKER
    // ------------------------------------------------------------------
    const customTruckIcon = L.divIcon({
      className: 'custom-pixel-truck-wrapper',
      html: `
        <div class="truck-marker-wrapper">
          <div class="speech-bubble" id="truckSpeech">Tasty Tacos! 🌮</div>
          <div class="pixel-taco-truck">
            <div class="truck-sign">TACO</div>
            <div class="awning"></div>
            <div class="truck-body">
              <div class="service-window">
                <div class="chef-inside">👨‍🍳</div>
              </div>
              <div class="truck-cabin">
                <div class="cabin-window"></div>
              </div>
              <div class="headlight"></div>
            </div>
            <div class="wheel wheel-left"></div>
            <div class="wheel wheel-right"></div>
          </div>
        </div>
      `,
      iconSize: [85, 70],
      iconAnchor: [42, 60]
    });

    const truckMarker = L.marker([seoulSpots[0].lat, seoulSpots[0].lng], { icon: customTruckIcon }).addTo(map);

    // Rotating Cute Speech Bubble Phrases
    const phrases = ["Tasty Tacos! 🌮", "Cooking Live! 🔥", "Fresh Daily! 🌱", "Hongdae Stop! 📍", "Yummy Birria! 🧀"];
    let phraseIdx = 0;
    setInterval(() => {
      phraseIdx = (phraseIdx + 1) % phrases.length;
      const elem = document.getElementById('truckSpeech');
      if (elem) elem.innerText = phrases[phraseIdx];
    }, 3500);

    function moveToSpot(idx) {
      const spot = seoulSpots[idx];
      map.flyTo([spot.lat, spot.lng], 15, { duration: 1.5 });
      truckMarker.setLatLng([spot.lat, spot.lng]);
      document.getElementById('locationName').innerText = spot.name;
      document.getElementById('seoulSpotBadge').innerText = spot.code;
    }

    // Weather Engine
    let activePrecipitationType = null;

    async function fetchSeoulLiveWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
        const data = await res.json();
        const weather = data.current_weather;
        const tempStr = `${Math.round(weather.temperature)}°C`;
        const code = weather.weathercode;
        const isDay = weather.is_day === 1;

        if (code >= 51 && code <= 67) {
          applyWeatherVisuals('radial-gradient(circle, transparent 40%, rgba(15, 23, 42, 0.65) 100%)', 'SEOUL RAIN 🌧️', tempStr, '🌧️', 'rain');
        } else if (code >= 71 && code <= 77) {
          applyWeatherVisuals('radial-gradient(circle, transparent 40%, rgba(226, 232, 240, 0.45) 100%)', 'SEOUL SNOW ❄️', tempStr, '❄️', 'snow');
        } else if (!isDay) {
          applyWeatherVisuals('radial-gradient(circle, transparent 30%, rgba(15, 23, 42, 0.8) 100%)', 'SEOUL NIGHT 🌙', tempStr, '🌙', null);
        } else {
          applyWeatherVisuals('radial-gradient(circle, transparent 60%, rgba(253, 224, 71, 0.2) 100%)', 'SEOUL DAYLIGHT ☀️', tempStr, '☀️', null);
        }
      } catch (e) {
        applyWeatherVisuals('radial-gradient(circle, transparent 60%, rgba(253, 224, 71, 0.2) 100%)', 'SEOUL LIVE ☀️', '20°C', '☀️', null);
      }
    }

    function applyWeatherVisuals(vignetteStyle, statusText, tempText, iconSymbol, precipType) {
      document.getElementById('weatherVignette').style.background = vignetteStyle;
      document.getElementById('weatherStatusText').innerText = statusText;
      document.getElementById('weatherIconDisplay').innerText = iconSymbol;
      document.getElementById('tempDisplay').innerText = tempText;
      activePrecipitationType = precipType;
    }

    setInterval(fetchSeoulLiveWeather, 300000);

    // Rain / Snow Particle Engine
    const pCanvas = document.getElementById('precipCanvas');
    const pCtx = pCanvas.getContext('2d');
    let pWidth = pCanvas.width = window.innerWidth;
    let pHeight = pCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      pWidth = pCanvas.width = window.innerWidth;
      pHeight = pCanvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 100 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      speed: Math.random() * 4 + 2,
      length: Math.random() * 8 + 6,
      size: Math.random() * 3 + 2
    }));

    function renderPrecipitation() {
      pCtx.clearRect(0, 0, pWidth, pHeight);
      if (activePrecipitationType) {
        particles.forEach(p => {
          p.y += p.speed;
          if (p.y > pHeight) { p.y = -10; p.x = Math.random() * pWidth; }
          if (activePrecipitationType === 'rain') {
            pCtx.strokeStyle = '#7dd3fc';
            pCtx.lineWidth = 1.5;
            pCtx.beginPath();
            pCtx.moveTo(p.x, p.y);
            pCtx.lineTo(p.x - 2, p.y + p.length);
            pCtx.stroke();
          } else if (activePrecipitationType === 'snow') {
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(p.x, p.y, p.size, p.size);
          }
        });
      }
      requestAnimationFrame(renderPrecipitation);
    }

    // Menu Data
    const menuItems = [
      { name: 'Carne Asada Taco', krName: '카르네 아사다 타코', price: '₩4,500', desc: 'Charred flank steak, cilantro, diced white onion, salsa verde.', stock: 6, icon: '🥩' },
      { name: 'Birria Quesa Taco', krName: '비리아 퀘사 타코', price: '₩5,000', desc: 'Slow-braised beef, melted Oaxaca cheese, rich consommé dip.', stock: 18, icon: '🧀' },
      { name: 'Al Pastor Taco', krName: '알 파스토르 타코', price: '₩4,500', desc: 'Achiote-marinated roasted pork, grilled pineapple, salsa roja.', stock: 24, icon: '🍍' },
      { name: 'Baja Fish Taco', krName: '바하 피쉬 타코', price: '₩5,000', desc: 'Crispy beer-battered fish, chipotle crema, cabbage slaw.', stock: 3, icon: '🐟' }
    ];

    const originData = [
      { ingredient: 'Beef (소고기)', origin: 'USA / Australia', note: 'USDA Choice Flank & Chuck' },
      { ingredient: 'Pork (돼지고기)', origin: 'Domestic Korea (국내산)', note: 'Jeju Fresh Pork Shoulder' },
      { ingredient: 'Chicken (닭고기)', origin: 'Domestic Korea (국내산)', note: 'Antibiotic-free Thigh' },
      { ingredient: 'Fish (대구)', origin: 'Russia / Pacific', note: 'Wild-Caught Cod Fillet' }
    ];

    function renderMenu() {
      document.getElementById('menuGrid').innerHTML = menuItems.map(item => `
        <div class="border-2 border-black bg-white p-3 flex flex-col justify-between shadow-[3px_3px_0_0_#000]">
          <div>
            <div class="flex items-start justify-between gap-2 mb-1">
              <div>
                <h3 class="text-black font-bold text-xs">${item.icon} ${item.name}</h3>
                <p class="text-[9px] text-gray-600 font-bold">${item.krName}</p>
              </div>
              <span class="font-arcade text-black font-bold text-[10px] bg-[#ffca3a] px-1.5 py-0.5 border border-black">${item.price}</span>
            </div>
            <p class="text-[10px] text-gray-700 mb-2 leading-relaxed">${item.desc}</p>
          </div>
          <div class="flex items-center justify-between border-t border-black pt-2 text-[10px]">
            <span class="text-gray-800 font-bold">STOCK:</span>
            <span class="font-arcade font-bold ${item.stock <= 8 ? 'text-red-600 animate-pulse' : 'text-emerald-700'}">${item.stock} LEFT</span>
          </div>
        </div>
      `).join('');

      document.getElementById('originTableBody').innerHTML = originData.map(row => `
        <tr class="hover:bg-amber-50">
          <td class="p-2 font-bold text-black">${row.ingredient}</td>
          <td class="p-2 text-emerald-800 font-bold">${row.origin}</td>
          <td class="p-2 text-gray-700 text-[10px]">${row.note}</td>
        </tr>
      `).join('');
    }

    let currentPage = 1;
    function toggleMenu(show) { document.getElementById('menuModal').classList.toggle('hidden', !show); }
    function changePage(delta) {
      currentPage = Math.max(1, Math.min(2, currentPage + delta));
      document.getElementById('page1').classList.toggle('hidden', currentPage !== 1);
      document.getElementById('page2').classList.toggle('hidden', currentPage !== 2);
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage === 2;
      document.getElementById('pageIndicator').innerText = `PG ${currentPage} / 2`;
    }

    fetchSeoulLiveWeather();
    renderMenu();
    renderPrecipitation();
  </script>
</body>
</html>
